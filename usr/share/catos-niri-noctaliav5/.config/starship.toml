"$schema" = "https://starship.rs/config-schema.json"
palette = "noctalia"

format = """
[░▒▓](sapphire)\
$os\
$username\
$hostname\
[](bg:overlay2 fg:sapphire)\
$directory\
[](fg:overlay2 bg:surface2)\
$git_branch\
$git_status\
$git_state\
[](fg:surface2 bg:overlay1)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$python\
$java\
$kotlin\
$php\
$haskell\
$docker_context\
$conda\
$pixi\
[](fg:overlay1 bg:surface1)\
$time\
[ ](fg:surface1)\
$line_break\
$character"""

[os]
disabled = false
style = "bg:sapphire fg:crust"
format = "[ $symbol ]($style)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "\uE900"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CachyOS = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = false
style_user = "bg:sapphire fg:crust"
style_root = "bold bg:sapphire fg:maroon"
format = "[$user ]($style)"

[hostname]
ssh_only = true
style = "bg:sapphire fg:crust"
format = "[@$hostname ]($style)"

[directory]
style = "fg:text bg:overlay2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:surface2"
format = "[[ $symbol $branch ](fg:sapphire bg:surface2)]($style)"

[git_status]
style = "bg:surface2"
format = "[[($all_status$ahead_behind )](fg:sapphire bg:surface2)]($style)"

[git_state]
style = "bg:surface2"
format = "[[ $state( $progress_current/$progress_total) ](fg:peach bg:surface2)]($style)"

[c]
symbol = ""
style = "bg:overlay1"
format = "[[ $symbol ($version) ](fg:sapphire bg:overlay1)]($style)"

[cpp]
symbol = ""
style = "bg:overlay1"
format = "[[ $symbol ($version) ](fg:sapphire bg:overlay1)]($style)"

[rust]
symbol = ""
style = "bg:overlay1"
format = "[[ $symbol ($version) ](fg:sapphire bg:overlay1)]($style)"

[golang]
symbol = ""
style = "bg:overlay1"
format = "[[ $symbol ($version) ](fg:sapphire bg:overlay1)]($style)"

[nodejs]
symbol = ""
style = "bg:overlay1"
format = "[[ $symbol ($version) ](fg:sapphire bg:overlay1)]($style)"

[bun]
symbol = ""
style = "bg:overlay1"
format = "[[ $symbol ($version) ](fg:sapphire bg:overlay1)]($style)"

[python]
symbol = ""
style = "bg:overlay1"
format = "[[ $symbol ($version)( \\($virtualenv\\)) ](fg:sapphire bg:overlay1)]($style)"

[java]
symbol = ""
style = "bg:overlay1"
format = "[[ $symbol ($version) ](fg:sapphire bg:overlay1)]($style)"

[kotlin]
symbol = ""
style = "bg:overlay1"
format = "[[ $symbol ($version) ](fg:sapphire bg:overlay1)]($style)"

[php]
symbol = ""
style = "bg:overlay1"
format = "[[ $symbol ($version) ](fg:sapphire bg:overlay1)]($style)"

[haskell]
symbol = ""
style = "bg:overlay1"
format = "[[ $symbol ($version) ](fg:sapphire bg:overlay1)]($style)"

[docker_context]
symbol = ""
style = "bg:overlay1"
format = "[[ $symbol $context ](fg:sapphire bg:overlay1)]($style)"
only_with_files = true

[conda]
symbol = ""
style = "bg:overlay1"
format = "[[ $symbol $environment ](fg:sapphire bg:overlay1)]($style)"

[pixi]
symbol = "󰏗"
style = "bg:overlay1"
format = "[[ $symbol ($version)( $environment) ](fg:sapphire bg:overlay1)]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:surface1"
format = "[[  $time ](fg:text bg:surface1)]($style)"

[character]
success_symbol = "[❯](bold overlay2)"
error_symbol = "[❯](bold flamingo)"
vimcmd_symbol = "[❮](bold teal)"
vimcmd_replace_one_symbol = "[❮](bold mauve)"
vimcmd_replace_symbol = "[❮](bold mauve)"
vimcmd_visual_symbol = "[❮](bold peach)"

