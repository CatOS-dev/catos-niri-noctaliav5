"$schema" = "https://starship.rs/config-schema.json"
palette = "noctalia"

format = """
[░▒▓](sapphire)\
$os\
$username\
$hostname\
[](bg:overlay2 fg:sapphire)\
$directory\
[](fg:overlay2 bg:surface2)\
$git_branch\
$git_status\
$git_state\
[](fg:surface2 bg:overlay1)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$python\
$java\
$kotlin\
$php\
$haskell\
$docker_context\
$conda\
$pixi\
[](fg:overlay1 bg:surface1)\
$time\
[ ](fg:surface1)\
$line_break\
$character"""

[os]
disabled = false
style = "bg:sapphire fg:crust"
format = "[ $symbol ]($style)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "\uE900"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CachyOS = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = false
style_user = "bg:sapphire fg:crust"
style_root = "bold bg:sapphire fg:flamingo" # Root 用户使用 Error 语义色 (红/粉) 更醒目
format = "[$user ]($style)"

[hostname]
ssh_only = true
style = "bg:sapphire fg:crust"
format = "[@$hostname ]($style)"

[directory]
style = "bg:overlay2 fg:text"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:surface2"
format = "[ $symbol ](fg:sapphire bg:surface2)[ $branch ](fg:text bg:surface2)" # 图标主色，文字辅色

[git_status]
style = "bg:surface2"
format = "[($all_status$ahead_behind )](fg:subtext1 bg:surface2)"

[git_state]
style = "bg:surface2"
format = "[ $state( $progress_current/$progress_total) ](fg:peach bg:surface2)" # 进行中状态使用 Tertiary 警告色

# --- 语言环境 (Secondary Accent: Teal) ---
[c]
symbol = ""
style = "bg:overlay1"
format = "[ $symbol ](fg:teal bg:overlay1)[($version)](fg:subtext1 bg:overlay1)"

[cpp]
symbol = ""
style = "bg:overlay1"
format = "[ $symbol ](fg:teal bg:overlay1)[($version)](fg:subtext1 bg:overlay1)"

[rust]
symbol = ""
style = "bg:overlay1"
format = "[ $symbol ](fg:teal bg:overlay1)[($version)](fg:subtext1 bg:overlay1)"

[golang]
symbol = ""
style = "bg:overlay1"
format = "[ $symbol ](fg:teal bg:overlay1)[($version)](fg:subtext1 bg:overlay1)"

[nodejs]
symbol = ""
style = "bg:overlay1"
format = "[ $symbol ](fg:teal bg:overlay1)[($version)](fg:subtext1 bg:overlay1)"

[bun]
symbol = ""
style = "bg:overlay1"
format = "[ $symbol ](fg:teal bg:overlay1)[($version)](fg:subtext1 bg:overlay1)"

[python]
symbol = ""
style = "bg:overlay1"
format = "[ $symbol ](fg:teal bg:overlay1)[($version)](fg:subtext1 bg:overlay1)[\\($virtualenv\\)](fg:mauve bg:overlay1)" # 虚拟环境使用 Tertiary 色区分

[java]
symbol = ""
style = "bg:overlay1"
format = "[ $symbol ](fg:teal bg:overlay1)[($version)](fg:subtext1 bg:overlay1)"

[kotlin]
symbol = ""
style = "bg:overlay1"
format = "[ $symbol ](fg:teal bg:overlay1)[($version)](fg:subtext1 bg:overlay1)"

[php]
symbol = ""
style = "bg:overlay1"
format = "[ $symbol ](fg:teal bg:overlay1)[($version)](fg:subtext1 bg:overlay1)"

[haskell]
symbol = ""
style = "bg:overlay1"
format = "[ $symbol ](fg:teal bg:overlay1)[($version)](fg:subtext1 bg:overlay1)"

# --- 容器与工具 (Tertiary Accents: Mauve/Peach) ---
[docker_context]
symbol = ""
style = "bg:overlay1"
format = "[ $symbol ](fg:mauve bg:overlay1)[ $context ](fg:subtext1 bg:overlay1)"
only_with_files = true

[conda]
symbol = ""
style = "bg:overlay1"
format = "[ $symbol ](fg:mauve bg:overlay1)[ $environment ](fg:subtext1 bg:overlay1)"

[pixi]
symbol = "󰏗"
style = "bg:overlay1"
format = "[ $symbol ](fg:mauve bg:overlay1)[($version)](fg:subtext1 bg:overlay1)[ $environment ](fg:peach bg:overlay1)"

# --- 辅助信息 (Low Emphasis) ---
[time]
disabled = false
time_format = "%R"
style = "bg:surface1"
format = "[  ](fg:subtext0 bg:surface1)[ $time ](fg:text bg:surface1)" # 图标弱化，时间清晰

# --- 交互提示符 ---
[character]
success_symbol = "[❯](bold teal)"      # 成功/就绪使用 Secondary (绿/青)
error_symbol = "[❯](bold flamingo)"    # 错误使用 Error (红/粉)
vimcmd_symbol = "[❮](bold sapphire)"   # Vim Normal 使用 Primary (蓝)
vimcmd_replace_one_symbol = "[❮](bold mauve)"
vimcmd_replace_symbol = "[❮](bold mauve)"
vimcmd_visual_symbol = "[❮](bold peach)"

