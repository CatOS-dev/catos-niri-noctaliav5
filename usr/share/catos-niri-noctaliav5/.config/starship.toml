"$schema" = "https://starship.rs/config-schema.json"
palette = "noctalia"

# --- 从左到右的单向渐变：sapphire → overlay2 → overlay1 → overlay0 → surface1 ---
format = """
[](fg:sapphire)\
$os\
$username\
$hostname\
[](fg:sapphire bg:overlay2)\
$directory\
[](fg:overlay2 bg:overlay1)\
$git_branch\
$git_status\
$git_state\
[](fg:overlay1 bg:overlay0)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$python\
$java\
$kotlin\
$php\
$haskell\
$docker_context\
$conda\
$pixi\
[](fg:overlay0 bg:surface1)\
$time\
[](fg:surface1)\
$line_break\
[╰─](bold sapphire)$character"""

[os]
disabled = false
style = "bg:sapphire fg:crust"
format = "[ $symbol ]($style)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "\uE900"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CachyOS = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = false
style_user = "bg:sapphire fg:crust"
style_root = "bold bg:sapphire fg:flamingo"
format = "[$user ]($style)"

[hostname]
ssh_only = true
style = "bg:sapphire fg:crust"
format = "[@$hostname ]($style)"

# --- 渐变第 2 阶：overlay2 ---
[directory]
style = "bg:overlay2 fg:text"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# --- 渐变第 3 阶：overlay1 ---
[git_branch]
symbol = ""
style = "bg:overlay1"
format = "[ $symbol ](fg:sapphire bg:overlay1)[ $branch ](fg:text bg:overlay1)"

[git_status]
style = "bg:overlay1"
format = "[($all_status$ahead_behind )](fg:subtext1 bg:overlay1)"

[git_state]
style = "bg:overlay1"
format = "[ $state( $progress_current/$progress_total) ](fg:peach bg:overlay1)"

# --- 渐变第 4 阶：overlay0（语言与工具）---
[c]
symbol = ""
style = "bg:overlay0"
format = "[ $symbol ](fg:teal bg:overlay0)[($version)](fg:subtext1 bg:overlay0)"

[cpp]
symbol = ""
style = "bg:overlay0"
format = "[ $symbol ](fg:teal bg:overlay0)[($version)](fg:subtext1 bg:overlay0)"

[rust]
symbol = ""
style = "bg:overlay0"
format = "[ $symbol ](fg:teal bg:overlay0)[($version)](fg:subtext1 bg:overlay0)"

[golang]
symbol = ""
style = "bg:overlay0"
format = "[ $symbol ](fg:teal bg:overlay0)[($version)](fg:subtext1 bg:overlay0)"

[nodejs]
symbol = ""
style = "bg:overlay0"
format = "[ $symbol ](fg:teal bg:overlay0)[($version)](fg:subtext1 bg:overlay0)"

[bun]
symbol = ""
style = "bg:overlay0"
format = "[ $symbol ](fg:teal bg:overlay0)[($version)](fg:subtext1 bg:overlay0)"

[python]
symbol = ""
style = "bg:overlay0"
format = "[ $symbol ](fg:teal bg:overlay0)[($version)](fg:subtext1 bg:overlay0)[\\($virtualenv\\)](fg:mauve bg:overlay0)"

[java]
symbol = ""
style = "bg:overlay0"
format = "[ $symbol ](fg:teal bg:overlay0)[($version)](fg:subtext1 bg:overlay0)"

[kotlin]
symbol = ""
style = "bg:overlay0"
format = "[ $symbol ](fg:teal bg:overlay0)[($version)](fg:subtext1 bg:overlay0)"

[php]
symbol = ""
style = "bg:overlay0"
format = "[ $symbol ](fg:teal bg:overlay0)[($version)](fg:subtext1 bg:overlay0)"

[haskell]
symbol = ""
style = "bg:overlay0"
format = "[ $symbol ](fg:teal bg:overlay0)[($version)](fg:subtext1 bg:overlay0)"

[docker_context]
symbol = ""
style = "bg:overlay0"
format = "[ $symbol ](fg:mauve bg:overlay0)[ $context ](fg:subtext1 bg:overlay0)"
only_with_files = true

[conda]
symbol = ""
style = "bg:overlay0"
format = "[ $symbol ](fg:mauve bg:overlay0)[ $environment ](fg:subtext1 bg:overlay0)"

[pixi]
symbol = "󰏗"
style = "bg:overlay0"
format = "[ $symbol ](fg:mauve bg:overlay0)[($version)](fg:subtext1 bg:overlay0)[ $environment ](fg:peach bg:overlay0)"

# --- 渐变第 5 阶：surface1（尾部，融入终端背景）---
[time]
disabled = false
time_format = "%R"
style = "bg:surface1"
format = "[  ](fg:white bg:surface1)[ $time ](fg:text bg:surface1)"

# --- 交互提示符 ---
[character]
success_symbol = "[❯](bold teal)"
error_symbol = "[❯](bold flamingo)"
vimcmd_symbol = "[❮](bold sapphire)"
vimcmd_replace_one_symbol = "[❮](bold mauve)"
vimcmd_replace_symbol = "[❮](bold mauve)"
vimcmd_visual_symbol = "[❮](bold peach)"

